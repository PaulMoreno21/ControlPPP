spring.application.name=practicas

# Load local secrets when running from the backend directory; shell variables still take precedence.
spring.config.import=optional:file:.env[.properties]

# Oracle connection. Credentials are supplied by the runtime environment.
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# The database schema is managed with the approved Oracle DDL, not generated by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Confirm this claim name with the institutional identity provider before enabling OAuth/JWT.
app.security.identity-claim=${OAUTH_IDENTITY_CLAIM:email}

# Local JWT signing key; generate a random value of at least 32 bytes and keep it in .env.
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}
app.jwt.expiration-seconds=${APP_SESSION_MAX_DURATION_SECONDS:28800}
app.session.idle-timeout-seconds=${APP_SESSION_IDLE_TIMEOUT_SECONDS:900}
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:true}
app.session.max-active=${APP_SESSION_MAX_ACTIVE:50000}

# Local in-memory rate limits for /api/** (independent IP, authenticated user and login budgets).
app.rate-limit.ip-requests=${RATE_LIMIT_IP_REQUESTS:300}
app.rate-limit.user-requests=${RATE_LIMIT_USER_REQUESTS:120}
app.rate-limit.login-requests=${RATE_LIMIT_LOGIN_REQUESTS:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:50000}
# Trust only explicit reverse proxy connection addresses; it must overwrite X-Real-IP.
app.rate-limit.trusted-proxy-ips=${RATE_LIMIT_TRUSTED_PROXY_IPS:}
server.forward-headers-strategy=none

# Annual preload, persisted completion prevents repeated requests after restarts or manual edits.
app.holidays.sync.enabled=${APP_HOLIDAY_SYNC_ENABLED:true}
app.holidays.sync.api-key=${FERIADOS_API_KEY:}
app.holidays.sync.administrator-id=${APP_HOLIDAY_SYNC_ADMIN_ID:0}
app.holidays.sync.cron=${APP_HOLIDAY_SYNC_CRON:0 15 3 1 1 *}
