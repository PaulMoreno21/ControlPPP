@if (totalItems > pageSize) {
  <nav class="pagination" aria-label="Paginación de la tabla">
    <span class="pagination-summary">{{ (currentPage - 1) * pageSize + 1 }}–{{ currentPage * pageSize < totalItems ? currentPage * pageSize : totalItems }} de {{ totalItems }}</span>
    <div class="pagination-controls">
      <button type="button" aria-label="Primera página" (click)="selectPage(1)" [disabled]="disabled || currentPage <= 1">«</button>
      <button type="button" aria-label="Página anterior" (click)="selectPage(currentPage - 1)" [disabled]="disabled || currentPage <= 1">‹</button>
      @for (page of pages; track $index) {
        @if (page === '…') { <span class="pagination-ellipsis" aria-hidden="true">…</span> }
        @else { <button type="button" [class.active]="page === currentPage" [attr.aria-current]="page === currentPage ? 'page' : null" [attr.aria-label]="'Página ' + page" (click)="selectPage(page)" [disabled]="disabled">{{ page }}</button> }
      }
      <button type="button" aria-label="Página siguiente" (click)="selectPage(currentPage + 1)" [disabled]="disabled || currentPage >= pageCount">›</button>
      <button type="button" aria-label="Última página" (click)="selectPage(pageCount)" [disabled]="disabled || currentPage >= pageCount">»</button>
    </div>
  </nav>
}
